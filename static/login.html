<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>登入</title>
        <style>
        body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f5f7;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
        form{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px #0002;width:min(340px,90vw)}h2{margin:0 0 16px;color:#06c755}
        input{width:100%;box-sizing:border-box;font:inherit;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px}
        button{width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:#06c755;color:#fff;cursor:pointer}button:disabled{background:#ccc}#err{color:#c62828;font-size:14px;min-height:20px;margin-bottom:6px}</style></head>
    <body>
        <form id="f">
            <h2>📩 家長訊息後台</h2>
            <input id="u" placeholder="帳號" autocomplete="username" required>
            <input id="p" type="password" placeholder="密碼" autocomplete="current-password" required>
            <div id="err"></div>
            <button id="b">登入</button>
        </form>
        <script>
            document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('err');b.disabled=true;er.textContent='';
            try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
                const j=await r.json().catch(()=>({}));if(r.ok)location.href='/';else{er.textContent=j.detail||'登入失敗';b.disabled=false}}catch(x){er.textContent='連線失敗';b.disabled=false}};
        </script>
    </body>
</html>
